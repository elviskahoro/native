# This file controls the behavior of Trunk: https://docs.trunk.io/cli # To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0

# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins

    - id: oss-linter-trunk
      ref: v0.2026.04.14.00.00
      uri: https://github.com/elviskahoro/oss-linter-trunk-config

    - id: add-trailing-comma-plugin
      ref: v0.1.0
      uri: https://github.com/elviskahoro/oss-linter-trunk-add-trailing-comma

    - id: pyrefly-plugin
      ref: v0.2.0
      uri: https://github.com/elviskahoro/oss-linter-trunk-pyrefly

    - id: tach-plugin
      ref: v0.1.0
      uri: https://github.com/elviskahoro/oss-linter-trunk-tach

# actionlint switched from upstream rhysd/actionlint to the actively maintained
# fork kjanat/actionlint (forked from upstream v1.7.12, independent releases from
# v1.8.0, CLI-compatible). Trunk's plugin catalog still pins the rhysd download
# URL, so override it here until the catalog carries the fork. Asset naming and
# the -format JSON output the plugin's `lint` command relies on are unchanged.
downloads:
  - name: actionlint
    downloads:
      - os:
          linux: linux
          macos: darwin
        cpu:
          x86_64: amd64
          arm_64: arm64
        url: https://github.com/kjanat/actionlint/releases/download/v${version}/actionlint_${version}_${os}_${cpu}.tar.gz
      - os: windows
        cpu:
          x86_64: amd64
          arm_64: arm64
        url: https://github.com/kjanat/actionlint/releases/download/v${version}/actionlint_${version}_windows_${cpu}.zip

# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  definitions:
    - name: ruff
      commands:
        - name: format
          enabled: true
        - name: lint
          enabled: true

    # Vale is scoped exclusively to docs/** (see .vale.ini). There's no
    # first-class "restrict this linter to a directory" field on `enabled`
    # entries, so introduce a custom file type matched by full relative
    # path -- `regexes` match against the path from the repo root, unlike
    # `extensions`, which would also pick up markdown outside docs/ (e.g.
    # webhooks/README.md, CHANGELOG.md).
    - name: vale
      files: [docs-markdown]

  files:
    - name: docs-markdown
      regexes:
        - ^docs/.+\.(md|mdx)$

  enabled:
    - actionlint@1.17.0
    - add-trailing-comma@4.0.0
    - bandit@1.9.4
    - buildifier@8.2.1
    - checkov@3.3.19
    - markdown-link-check@3.15.0
    - markdownlint-cli2@0.23.3
    - osv-scanner@2.6.0
    - oxipng@10.1.1
    - pinact@4.0.0
    - pyrefly@1.3.1
    - pyright@1.1.414
    - ruff@0.16.8
    - semgrep@1.177.0
    - shellcheck@0.11.0
    - shfmt@3.13.1
    - squawk@2.65.0
    - svgo@4.1.0
    - tach@0.35.1
    - taplo@0.10.0
    - trivy@0.70.0
    - trufflehog@3.95.3
    - ty@0.0.35
    - vale@3.14.1
    - yamlfmt@0.21.0
    - yamllint@1.38.0

  disabled:
    - ansible-lint
    - autopep8
    - biome
    - black
    - brakeman
    - buf-breaking
    - buf-format
    - buf-lint
    - cfnlint
    - circleci
    - clang-format
    - clang-tidy
    - clippy
    - cmake-format
    - codespell
    - cspell
    - cue-fmt
    - dart
    - deno
    - detekt
    - detekt-explicit
    - detekt-gradle
    - djlint
    - dotenv-linter
    - dotnet-format
    - dustilock
    - eslint
    - flake8
    - git-diff-check
    - gitleaks
    - gofmt
    - gofumpt
    - goimports
    - gokart
    - golangci-lint
    - golangci-lint2
    - golines
    - google-java-format
    - graphql-schema-linter
    - hadolint
    - haml-lint
    - include-what-you-use
    - isort
    - ktlint
    - kube-linter
    - ls-lint
    - markdown-table-prettify
    - markdownlint
    - mypy
    - nancy
    - nbstripout
    - nixpkgs-fmt
    - opa
    - perlcritic
    - perltidy
    - php-cs-fixer
    - phpstan
    - pmd
    - pragma-once
    - pre-commit-hooks
    - prettier
    - prisma
    - psscriptanalyzer
    - pylint
    - regal
    - remark-lint
    - renovate
    - rome
    - rubocop
    - ruff-nbqa
    - rufo
    - rumdl
    - rustfmt
    - scalafmt
    - snyk
    - sort-package-json
    - sourcery
    - sql-formatter
    - sqlfluff
    - sqlfmt
    - standardrb
    - stringslint
    - stylelint
    - stylua
    - swiftformat
    - swiftlint
    - terraform
    - terragrunt
    - terrascan
    - tflint
    - tfsec
    - tofu
    - trufflehog-git
    - trunk-toolbox
    - txtpbfmt
    - yapf

  ignore:
    - linters: [ALL]
      paths:
        - data/**
        - tmp/**
        - worktrees/**
        - "**/*.openapi.json"
        - "**/*.openapi.yaml"
        - "**/*.openapi.yml"

    - linters: [ruff]
      paths:
        - "*.ipynb"

    # Trunk's pyrefly sandbox does not install reflex, so imports of
    # reflex submodules are reported as missing-import.
    - linters: [pyrefly]
      paths:
        - native/**

    # Documentation MDX mixes JSX components with fenced code blocks, which
    # markdownlint misreads as inconsistent code-block styles (MD046).
    - linters: [markdownlint, markdownlint-cli2]
      paths:
        - docs/**/*.mdx

    - linters: [checkov]
      paths:
        - api/specs/caldotcom-*.json

    - linters: [checkov, semgrep]
      paths:
        - "**/*.py"
        - "**/*.sh"
        - "**/*.md"
        - "**/*.parquet"
        - "**/*.png"
        - "**/*.jpg"
        - "**/*.jpeg"
        - "**/*.gif"
        - "**/*.ico"
        - "**/*.svg"
        - "**/*.webp"
        - "**/*.zip"
        - "**/*.tar"
        - "**/*.gz"
        - "**/*.bz2"
        - "**/*.7z"
        - "**/*.csv"
        - "**/*.xml"
        - "**/*.proto"

    - linters: [trivy]
      paths:
        - .trunk/**

    # The rules_python Gazelle manifest updater writes a leading YAML document
    # marker. Keep the generated bytes stable instead of making yamlfmt fight
    # the update target on every regeneration.
    - linters: [yamlfmt]
      paths:
        - gazelle_python.yaml

    - linters: [trufflehog]
      paths:
        - "**/*.parquet"

  exported_configs:
    - plugin_id: oss-linter-trunk
      configs:
        - configs/.bandit
        - configs/.clang-format
        - configs/.clang-tidy
        - configs/.clangd
        - configs/.editorconfig
        - configs/.flake8
        - configs/.gitattributes
        - configs/.gitignore
        - configs/.hadolint.yaml
        - configs/.isort.cfg
        - configs/.markdownlint.yaml
        - configs/.mypy.ini
        - configs/.pr-labels.yaml
        - configs/.prettierrc.yaml
        - configs/.pylintrc
        - configs/.remarkrc.yaml
        - configs/.shellcheckrc
        - configs/.sqlfluff
        - configs/.stylelintrc.js
        - configs/.stylelintrc.yaml
        - configs/.yamlfmt
        - configs/.yamllint.yaml
        - configs/pyrightconfig.json
        - configs/ruff.toml
        - configs/rustfmt.toml
        - configs/svgo.config.js

actions:
  enabled:
    - trunk-cache-prune
    - trunk-upgrade-available

  disabled:
    # git-hook-triggered actions disabled so trunk releases core.hooksPath to
    # Entire (checkpoints). trunk-check-pre-push is redundant with roborev + the
    # merge queue's required "Lint and type check with Trunk"; git-lfs is unused.
    - trunk-fmt-pre-commit
    - git-lfs
    - trunk-announce
    - trunk-check-pre-push

merge:
  # These must be live GitHub status names posted on every PR targeting main.
  # Re-verify after any pipeline rename:
  #   gh pr checks <pr-number> --json name --jq '.[].name'
  #
  # Per Trunk's docs, this list is one of three ways to define what the queue
  # waits on while a queued PR is testing (GitHub branch protection
  # required-checks are the default; a Trunk UI override is the third); it
  # does not control which PRs are admitted to the queue. With branch
  # protection plan-blocked here, this override is the queue's entire
  # wait-set configuration.
  #
  # The two RWX entries are posted by RWX (.rwx/trunk-check.yml and
  # .rwx/tests-bazel.yml) as commit statuses, not check-runs -- verified via
  # the statuses API on PR and trunk-merge/* draft heads, 2026-10-16 -- named
  # "RWX: <file> (pull request)" for pull_request events and "RWX: <file>
  # (push)" for push events, different names in different contexts. The
  # names below are the pull_request status names, which is what the merge
  # queue gates on when a PR is queued.
  #
  # pullfrog-approval is a check run posted by the pullfrog GitHub App when
  # the Pullfrog review run it dispatches per PR finishes -- "Review #N" on
  # PR open, "Review new commits on #N" on pushes -- distinct from the
  # "pullfrog" job check of the run itself. Requiring it closes the
  # fast-merge gap: #1113-#1116 merged seconds after creation, before the
  # ~6-7 minute review finished, cancelling the run and leaving no verdict,
  # and #991 merged over an explicit FAILURE posted on its test draft
  # (#1090). The queue tests in Draft PR mode and the app reviews those
  # trunk-merge/* drafts too, so every queued PR now holds for pullfrog's
  # verdict on the merge.
  #
  # Two Pullfrog console toggles are prerequisites for this gate to fire at
  # all (console -> Automations -> Review PRs; both default Off, so a fresh
  # app install starts with the gate inert): "Add Pullfrog's approval verdict
  # as a Check on pull requests" -- without it the pullfrog-approval check
  # never posts -- and "Include draft PRs" -- without it the app skips the
  # queue's trunk-merge/* drafts, so no verdict posts on the merge and every
  # queued PR stall-times out. PRs already in flight when a toggle is found
  # Off stay stuck until timeout -- dequeue them and requeue after fixing the
  # toggle, rather than waiting out the stall. Both toggles verified On
  # empirically 2026-10-16: a verdict
  # check posted on this PR's own head, and on queue drafts #1090/#1100 on
  # 2026-10-15. The deprecated `status_checks: enabled` workflow input
  # overrides both toggles; this repo's workflow_dispatch-only pullfrog.yml
  # does not use it, so the console is the live config. Re-check the console
  # alongside the name re-verification after any pullfrog app change.
  #
  # Known gaps, all fail-closed (the PR times out of the queue instead of
  # merging unreviewed): the app does not review
  # dependabot-authored PRs, so those cannot pass the queue and keep their
  # existing direct-merge path (gating them too needs a pullfrog-app
  # setting); a PR head is not re-reviewed after pullfrog's own "Fix CI"
  # commits (#1108) -- that head keeps no verdict, so push any new commit
  # (or re-trigger the review) before queueing or direct-merging, though a
  # queued run still reviews the merge draft itself; and a pullfrog-side
  # rename of the check fails silently (timeouts, no error) -- re-verify
  # the name per the header rule after touching the app. A spurious FAILURE
  # verdict on a draft ejects an otherwise-green PR -- requeue it
  # (`trunk merge <pr>`) or use break-glass. The cost is latency: every
  # queue run now waits out pullfrog's ~6-7 minute review of its draft, on
  # top of CI. Break-glass for a pullfrog outage: remove this entry, or
  # admin direct-merge past the queue. GitHub branch protection cannot
  # backstop any of this: private repo on the free org plan,
  # protection/rulesets APIs 403, so the queue is the only enforcement
  # point (#1117).
  #
  # "Entire Gates" comes from the Entire GitHub App and is the exact check-run name
  # observed on queue PR #1100 and bot PR #1031; it depends on that app reporting.
  # The docs job names were observed on docs PR #1110 and bot PR #1031.
  # Docs checks reports its named job statuses on every PR and skips only its
  # validation steps when none of its paths changed. Do NOT require a workflow
  # filtered by `pull_request.paths`; it would deadlock the queue. Same for the
  # workflow_run-triggered "Triage CI failure".
  #
  # Fork PRs get no Bazel coverage (tests-bazel skips them entirely via is-fork
  # guard -- an accepted tradeoff, matching GHA's own degraded fork behavior).
  required_statuses:
    - "RWX: trunk-check.yml (pull request)"
    - "RWX: tests-bazel.yml (pull request)"
    - Entire Gates
    - Docs validate + broken links
    - CLI reference drift + page lint
    # Re-verify this name after any pullfrog app change (header rule):
    #   gh pr checks <pr-number> --json name --jq '.[].name'
    # Unquoted on purpose: yamllint's quoted-strings rule (only-when-needed)
    # rejects the quoted form -- nothing here needs escaping.
    - pullfrog-approval
