# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
#
# Adapted from the SanhedrinTech/gtm-sdk reference setup (full plugin set and
# linter roster carried over; repo-specific deviations are commented inline).
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
    - id: oss-linter-trunk
      ref: v0.2026.04.14.00.00
      uri: https://github.com/elviskahoro/oss-linter-trunk-config
    - id: add-trailing-comma-plugin
      ref: v0.1.0
      uri: https://github.com/elviskahoro/oss-linter-trunk-add-trailing-comma
    - id: pyrefly-plugin
      ref: v0.2.0
      uri: https://github.com/elviskahoro/oss-linter-trunk-pyrefly
    - id: tach-plugin
      ref: v0.1.0
      uri: https://github.com/elviskahoro/oss-linter-trunk-tach
# actionlint switched from upstream rhysd/actionlint to the actively maintained
# fork kjanat/actionlint (forked from upstream v1.7.12, independent releases from
# v1.8.0, CLI-compatible). Trunk's plugin catalog still pins the rhysd download
# URL, so override it here until the catalog carries the fork. Asset naming and
# the -format JSON output the plugin's `lint` command relies on are unchanged.
downloads:
  - name: actionlint
    downloads:
      - os:
          linux: linux
          macos: darwin
        cpu:
          x86_64: amd64
          arm_64: arm64
        url: https://github.com/kjanat/actionlint/releases/download/v${version}/actionlint_${version}_${os}_${cpu}.tar.gz
      - os: windows
        cpu:
          x86_64: amd64
          arm_64: arm64
        url: https://github.com/kjanat/actionlint/releases/download/v${version}/actionlint_${version}_windows_${cpu}.zip
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  definitions:
    - name: ruff
      commands:
        - name: format
          enabled: true
        - name: lint
          enabled: true
    # Vale is scoped exclusively to docs/** (see .vale.ini). There's no
    # first-class "restrict this linter to a directory" field on `enabled`
    # entries, so introduce a custom file type matched by full relative
    # path -- `regexes` match against the path from the repo root, unlike
    # `extensions`, which would also pick up markdown outside docs/.
    - name: vale
      files: [docs-markdown]
  files:
    - name: docs-markdown
      regexes:
        - ^docs/.+\.(md|mdx)$
  enabled:
    - actionlint@1.17.0
    - add-trailing-comma@4.0.0
    - bandit@1.9.4
    - buildifier@8.2.0
    - checkov@3.3.19
    - markdown-link-check@3.15.0
    - markdownlint-cli2@0.23.3
    - osv-scanner@2.6.0
    - oxipng@10.1.1
    - pinact@4.0.0
    - pyrefly@1.3.1
    - pyright@1.1.414
    - ruff@0.16.8
    - semgrep@1.177.0
    - shellcheck@0.11.0
    - shfmt@3.13.1
    - squawk@2.65.0
    - svgo@4.1.0
    - tach@0.35.1
    - taplo@0.10.0
    - trivy@0.70.0
    - trufflehog@3.95.3
    - ty@0.0.35
    - vale@3.14.1
    - yamlfmt@0.21.0
    - yamllint@1.38.0
  disabled:
    - ansible-lint
    - autopep8
    - biome
    - black
    - brakeman
    - buf-breaking
    - buf-format
    - buf-lint
    - cfnlint
    - circleci
    - clang-format
    - clang-tidy
    - clippy
    - cmake-format
    - codespell
    - cspell
    - cue-fmt
    - dart
    - deno
    - detekt
    - detekt-explicit
    - detekt-gradle
    - djlint
    - dotenv-linter
    - dotnet-format
    - dustilock
    - eslint
    - flake8
    - git-diff-check
    - gitleaks
    - gofmt
    - gofumpt
    - goimports
    - gokart
    - golangci-lint
    - golangci-lint2
    - golines
    - google-java-format
    - graphql-schema-linter
    - hadolint
    - haml-lint
    - include-what-you-use
    - isort
    - ktlint
    - kube-linter
    - ls-lint
    - markdown-table-prettify
    - markdownlint
    - mypy
    - nancy
    - nbstripout
    - nixpkgs-fmt
    - opa
    - perlcritic
    - perltidy
    - php-cs-fixer
    - phpstan
    - pmd
    - pragma-once
    - pre-commit-hooks
    - prettier
    - prisma
    - psscriptanalyzer
    - pylint
    - regal
    - remark-lint
    - renovate
    - rome
    - rubocop
    - ruff-nbqa
    - rufo
    - rumdl
    - rustfmt
    - scalafmt
    - snyk
    - sort-package-json
    - sourcery
    - sql-formatter
    - sqlfluff
    - sqlfmt
    - standardrb
    - stringslint
    - stylelint
    - stylua
    - swiftformat
    - swiftlint
    - terraform
    - terragrunt
    - terrascan
    - tflint
    - tfsec
    - tofu
    - trufflehog-git
    - trunk-toolbox
    - txtpbfmt
    - yapf
  ignore:
    # Scratch/build outputs (tmp/worktrees from the reference; .web/,
    # frontend/ and assets/external/ are this repo's build products).
    - linters: [ALL]
      paths:
        - tmp/**
        - worktrees/**
        - .web/**
        - frontend/**
        - assets/external/**
    - linters: [ruff]
      paths:
        - "*.ipynb"
    # Documentation MDX mixes JSX components with fenced code blocks, which
    # markdownlint misreads as inconsistent code-block styles (MD046).
    - linters: [markdownlint, markdownlint-cli2]
      paths:
        - docs/**/*.mdx
    # Same rationale as the gtm-sdk reference: semgrep is slow and noisy on
    # non-source file types.
    - linters: [checkov, semgrep]
      paths:
        - "**/*.py"
        - "**/*.sh"
        - "**/*.md"
        - "**/*.png"
        - "**/*.jpg"
        - "**/*.jpeg"
        - "**/*.gif"
        - "**/*.ico"
        - "**/*.svg"
        - "**/*.webp"
        - "**/*.zip"
        - "**/*.tar"
        - "**/*.gz"
        - "**/*.bz2"
        - "**/*.7z"
        - "**/*.csv"
        - "**/*.xml"
        - "**/*.proto"
    - linters: [trivy]
      paths:
        - .trunk/**
  exported_configs:
    - plugin_id: oss-linter-trunk
      configs:
        - configs/.bandit
        - configs/.clang-format
        - configs/.clang-tidy
        - configs/.clangd
        - configs/.editorconfig
        - configs/.flake8
        - configs/.gitattributes
        - configs/.gitignore
        - configs/.hadolint.yaml
        - configs/.isort.cfg
        - configs/.markdownlint.yaml
        - configs/.mypy.ini
        - configs/.pr-labels.yaml
        - configs/.prettierrc.yaml
        - configs/.pylintrc
        - configs/.remarkrc.yaml
        - configs/.shellcheckrc
        - configs/.sqlfluff
        - configs/.stylelintrc.js
        - configs/.stylelintrc.yaml
        - configs/.yamlfmt
        - configs/.yamllint.yaml
        - configs/pyrightconfig.json
        - configs/ruff.toml
        - configs/rustfmt.toml
        - configs/svgo.config.js
actions:
  enabled:
    - trunk-cache-prune
    - trunk-upgrade-available
  disabled:
    # git-hook-triggered actions disabled so trunk never touches
    # core.hooksPath, which the shared git-hooks dispatcher (Entire
    # checkpoints + AI co-author stripping) owns -- the same collision the
    # gtm-sdk reference documents. trunk-check-pre-push is redundant with the
    # merge queue's required "Trunk Check" status; git-lfs is unused.
    - trunk-fmt-pre-commit
    - git-lfs
    - trunk-announce
    - trunk-check-pre-push
merge:
  # These must be live GitHub status names posted on every PR targeting main.
  # Re-verify after any pipeline rename:
  #   gh pr checks <pr-number> --json name --jq '.[].name'
  #
  # All three are posted by GitHub Actions job names:
  #   - Trunk Check                             -> .github/workflows/trunk-check.yml
  #   - Unit tests                              -> .github/workflows/tests.yml
  #   - Generate & Verify Docs and Social Cards -> .github/workflows/validate-assets.yml
  #
  # Every workflow triggers on pull_request -> main AND on push to
  # main + trunk-merge/**, so the queue's predictive test branches get the
  # same checks in both Draft-PR (default) and Push-Triggered testing modes.
  # The queue itself is created in the Trunk web app (app.trunk.io), not here;
  # this block overrides which statuses queue testing waits on.
  #
  # Do NOT add path-filtered workflows here (deploy.yml is push-to-main-only,
  # pullfrog.yml is manual dispatch -- neither posts on PRs) -- path-filtered
  # or workflow_run-triggered checks do not report on every PR and would
  # deadlock the queue.
  #
  # Unlike the gtm-sdk reference (whose Bazel gate skips fork PRs because it
  # needs registry secrets), all three gates here are secretless: fork PRs
  # get the same coverage from GitHub Actions' read-only fork runs.
  required_statuses:
    - Trunk Check
    - Unit tests
    - Generate & Verify Docs and Social Cards
