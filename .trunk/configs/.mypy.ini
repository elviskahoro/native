# Local mypy override. The oss-linter-trunk plugin ships a near-strict
# config (disallow_untyped_defs, disallow_incomplete_defs,
# check_untyped_defs, no_implicit_optional, strict_optional,
# warn_return_any) that flags every unannotated `def`. Relax the
# def-coverage flags so enabling mypy doesn't fail Trunk Check the
# moment any Python file is touched; keep no_implicit_optional,
# strict_optional, and warn_return_any inherited since they catch real
# bugs cheaply. Revisit when the codebase has annotation coverage.
[mypy]
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = False
