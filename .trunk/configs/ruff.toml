# Copied from the oss-linter-trunk plugin's exported configs/ruff.toml at
# ref v0.2026.04.14.00.00 (the version gtm-sdk pins in its plugins.sources).
# The plugin's export is the maintained copy: it renames the removed
# `force-sort-with-sections` field to `force-sort-within-sections` and drops
# gtm-sdk's stale PLR0917 ignore and libs/dlt per-file-ignores. Only deviation
# here: the tests/** S101 ignore (assert is pytest's normal check mechanism,
# not a production safety bypass).
# Note E501 (line length) is ignored -- the pre-existing codebase has a large
# line-length backlog that is intentionally not being fixed yet; touched-file
# correctness is on the contributor (file-diff gating).
[format]
quote-style = "double"

[lint]
fixable = ["ALL"]
select = [
  "A",
  "AIR",
  "ANN",
  "ARG",
  "ASYNC",
  "B",
  "BLE",
  "C",
  "C4",
  "COM",
  "D",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FBT",
  "FLY",
  "FIX",
  "G",
  "I",
  "ICN",
  "INP",
  "INT",
  "ISC",
  "N",
  "NPY",
  "PIE",
  "PGH",
  "PD",
  "PL",
  "PLE",
  "PLR",
  "PLW",
  "PT",
  "PTH",
  "PYI",
  "Q",
  "RSE",
  "RET",
  "RUF",
  "S",
  "SLF",
  "SIM",
  "TCH",
  "TD",
  "TID",
  "T10",
  "TRY",
  "W",
  "UP",
]
ignore = [
  "ANN101",
  "B008",
  "C901",
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D203",
  "D205",
  "D213",
  "D401",
  "D406",
  "D407",
  "D417",
  "E401",
  "E501",
  "ERA001",
  "F403",
  "F405",
  "F541",
  "FA102",
  "FIX002",
  "PIE807",
  "PLC0415",
  "PLR0913",
  "N815",
  "RUF100",
  "UP037",
]

[lint.isort]
case-sensitive = true
combine-as-imports = true
force-wrap-aliases = true
order-by-type = true

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
# Test modules: assert is pytest's mechanism; fixtures/params are untyped by
# convention and message strings in raises are test-local.
"tests/**" = ["S101", "INP001", "ANN", "EM", "TRY003", "PT018", "D"]
# Component source is copied verbatim into user projects by the CLI
# (shadcn-style), so sibling imports must stay relative.
"components/**" = ["TID252"]
# `input` is the public component name in the registry API (shadcn parity).
"components/ui/input*.py" = ["A001", "A004"]
"native/pages/create.py" = ["A004"]
# Generated by scripts/generate_anatomy.py (see CONTRIBUTING.md); regeneration
# would re-open these findings, so annotate the generator instead.
"native/registry/anatomy/**" = ["ANN", "D", "PLR0913", "A004", "INP001"]
# Docs example snippets: rendered verbatim into assets/docs, so they mirror the
# public component API (`input`, bool flags) and use random demo data.
"native/lib/**" = ["A001", "A004", "FBT", "S311", "DTZ007"]
# Build/maintenance scripts run directly (not imported as packages), not shipped runtime.
"scripts/**" = [
  "EM",
  "TRY003",
  "PTH",
  "EXE001",
  "D",
  "PLR0912",
  "PLR0915",
  "PLR0911",
  "E402",
  "S105",
  "TRY300",
  "BLE001",
  "INP001",
]

[lint.flake8-annotations]
# `*args: Any` / `**kwargs: Any` is the correct annotation for genuinely variadic pass-through.
allow-star-arg-any = true
