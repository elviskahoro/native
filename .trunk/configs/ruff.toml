# Copied from the oss-linter-trunk plugin's exported configs/ruff.toml at
# ref v0.2026.04.14.00.00 (the version gtm-sdk pins in its plugins.sources).
# The plugin's export is the maintained copy: it renames the removed
# `force-sort-with-sections` field to `force-sort-within-sections` and drops
# gtm-sdk's stale PLR0917 ignore and libs/dlt per-file-ignores. Only deviation
# here: the tests/** S101 ignore (assert is pytest's normal check mechanism,
# not a production safety bypass).
# Note E501 (line length) is ignored -- the pre-existing codebase has a large
# line-length backlog that is intentionally not being fixed yet; touched-file
# correctness is on the contributor (file-diff gating).
[format]
quote-style = "double"

[lint]
fixable = ["ALL"]
select = [
  "A",
  "AIR",
  "ANN",
  "ARG",
  "ASYNC",
  "B",
  "BLE",
  "C",
  "C4",
  "COM",
  "D",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FBT",
  "FLY",
  "FIX",
  "G",
  "I",
  "ICN",
  "INP",
  "INT",
  "ISC",
  "N",
  "NPY",
  "PIE",
  "PGH",
  "PD",
  "PL",
  "PLE",
  "PLR",
  "PLW",
  "PT",
  "PTH",
  "PYI",
  "Q",
  "RSE",
  "RET",
  "RUF",
  "S",
  "SLF",
  "SIM",
  "TCH",
  "TD",
  "TID",
  "T10",
  "TRY",
  "W",
  "UP",
]
ignore = [
  "ANN101",
  "B008",
  "C901",
  # Ruff's formatter and add-trailing-comma both manage trailing commas;
  # COM812 makes them repeatedly undo each other's edits.
  "COM812",
  # This repository uses relative imports for sibling modules in components.
  "TID252",
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D203",
  "D205",
  "D213",
  "D401",
  "D406",
  "D407",
  "D417",
  "E401",
  "E501",
  "ERA001",
  "F403",
  "F405",
  "F541",
  "FA102",
  "FIX002",
  "PIE807",
  "PLC0415",
  "PLR0913",
  "N815",
  "RUF100",
  "UP037",
]

[lint.isort]
case-sensitive = true
combine-as-imports = true
force-wrap-aliases = true
order-by-type = true

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
"tests/**" = ["S101", "INP001", "ANN001", "ANN201", "PT018", "D212", "D415"]
# Library examples are loaded as standalone source snippets, rather than
# imported as Python packages. Their demo functions are public to the example
# registry but are not a typed application API.
"native/lib/**" = [
  "INP001",
  "ANN001",
  "ANN002",
  "ANN003",
  "ANN201",
  "ANN202",
  "ANN206",
]
