# Copied from the gtm-sdk reference setup (.trunk/configs/.markdownlint.yaml).
# Autoformatter friendly markdownlint config (all formatting rules disabled)
default: true
blank_lines: false
bullet: false
html: false
indentation: false
line_length: false
spaces: false
url: false
whitespace: false
# Long component guides intentionally use multiple top-level sections, and
# generated prop tables use readable padded columns instead of MD060's strict
# pipe alignment.
MD025: false
MD060: false
MD041: false
MD024:
  siblings_only: true
