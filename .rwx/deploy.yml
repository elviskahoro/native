on:
  github:
    push:
      init:
        commit-sha: ${{ event.git.sha }}
        repository: https://github.com/elviskahoro/native.git
      if: ${{ event.git.branch == 'main' }}
  cli:
    # Manual `rwx run` dispatch. Vault secrets are only unlocked for main runs,
    # so a dispatch from another ref fails at `vercel pull`.
    init:
      commit-sha: ${{ event.git.sha }}
      repository: https://github.com/elviskahoro/native.git

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

tasks:
  - key: code
    call: git/clone 2.2.0
    with:
      repository: ${{ init.repository }}
      ref: ${{ init.commit-sha }}

  - key: node
    call: nodejs/install 1.2.0
    with:
      node-version: "22"

  - key: system-deps
    use: [node]
    run: |
      sudo apt-get update
      sudo apt-get install -y unzip

  - key: uv-install
    use: [system-deps]
    run: |
      set -euo pipefail
      script="$(mktemp)"
      trap 'rm -f "${script}"' EXIT
      curl -LsSf https://astral.sh/uv/0.11.29/install.sh -o "${script}"
      echo "504a79fd2ed0dcd47e7f04f0792cfd0871f62e24a7fe40fa8ae0f563a369f2bd  ${script}" | sha256sum -c -
      sh "${script}"
      echo "$HOME/.local/bin" >> "$RWX_ENV/PATH"

  - key: deps
    use: [code, uv-install]
    run: uv sync

  - key: export-frontend
    use: [deps]
    run: |
      uv run reflex export --frontend-only
      mkdir frontend
      unzip -o frontend.zip -d frontend
      ls -la frontend

  - key: vercel-install
    use: [node]
    run: npm install --global vercel

  # Provision with:
  #   rwx vaults secrets set --vault native VERCEL_TOKEN=... VERCEL_ORG_ID=... VERCEL_PROJECT_ID=...
  # cache: false so a deploy is never skipped by a cache hit.
  - key: deploy
    use: [export-frontend, vercel-install]
    cache: false
    env:
      VERCEL_TOKEN:
        value: ${{ vaults.native.secrets.VERCEL_TOKEN }}
        cache-key: excluded
      VERCEL_ORG_ID:
        value: ${{ vaults.native.secrets.VERCEL_ORG_ID }}
        cache-key: excluded
      VERCEL_PROJECT_ID:
        value: ${{ vaults.native.secrets.VERCEL_PROJECT_ID }}
        cache-key: excluded
    run: |
      set -euo pipefail
      cd frontend
      vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      vercel build --prod --token="$VERCEL_TOKEN"
      vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
