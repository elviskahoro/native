# Pyrefly configuration (strict).
#
# Under Trunk, the pyrefly plugin passes `--search-path ${workspace}` and
# `--python-interpreter-path ${workspace}/.venv/bin/python` explicitly because
# Trunk runs linters from a sandboxed tmp dir.
project-includes = [
  "native/**/*.py",
  "cli/**/*.py",
  "components/**/*.py",
  "scripts/**/*.py",
  "tests/**/*.py",
  "rxconfig.py",
]
project-excludes = [
  "tmp/**",
  "worktrees/**",
  ".web/**",
  "node_modules/**",
  ".venv/**",
]
search-path = ["."]
python-interpreter-path = ".venv/bin/python"
permissive-ignores = false
untyped-def-behavior = "check-and-infer-return-type"

[errors]
implicit-any = true
unannotated-parameter = true
unannotated-return = true
unused-ignore = true

# Reflex declares event triggers as `rx.EventHandler` class attributes, which
# pyrefly reads as non-data descriptors on a dataclass. components/ bans
# comments (copied verbatim into user projects), so scope the exemption here.
# Pyrefly applies only the first matching sub-config, so this block must repeat
# the components/** bad-override exemption below.
[[sub-config]]
matches = "components/ui/dialog.py"

[sub-config.errors]
bad-dataclass-descriptor = false
bad-override = false

# Every component overrides Reflex's `Component.create(*children, **props)`
# with a narrower, typed signature; that is the framework's extension idiom.
[[sub-config]]
matches = "components/**"

[sub-config.errors]
bad-override = false
