# Review with the pi agent via the Kilo gateway (needs KILO_API_KEY in the env; on RWX it comes from vaults.roborev.secrets.KILO_API_KEY, see .rwx/roborev.yml).
agent = "pi"
# Default only; .rwx/roborev.yml overrides it from the roborev vault var KILO_MODEL.
model = "kilo/deepseek/deepseek-v4-flash"
