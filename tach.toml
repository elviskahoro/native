# Tach module boundary enforcement for the repository's Python packages.
# Application code may live in these modules; imports between them follow the
# dependency direction below.
source_roots = ["."]
root_module = "forbid"
exclude = [
  "tests/**",
  "docs/**",
  "assets/**",
  ".github/**",
  ".web/**",
  "frontend/**",
  "tmp/**",
  "worktrees/**",
  ".venv/**",
  "ai/**",
]

[[modules]]
path = "components"

[[modules]]
path = "native"
depends_on = ["components"]

[[modules]]
path = "cli"
depends_on = ["native", "components"]

[[modules]]
path = "scripts"
depends_on = ["native"]
