# Copied from the gtm-sdk reference setup (.vale.ini), adapted: no
# generated CLI-reference pages here, and the vocabulary is Native's.
StylesPath = docs/styles
Vocab = Native

# Treat documentation .mdx files as plain Markdown rather than Vale's native mdx
# format, which shells out to the external `mdx2vast` npm package. Losing
# JSX-aware skipping is an acceptable tradeoff for not adding a Node
# dependency to the lint toolchain.
[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = Vale
